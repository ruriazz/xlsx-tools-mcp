[project]
name = "xlsx-tools-mcp"
version = "0.1.0"
description = "MCP server for accurate, structure-preserving read/write access to Excel (.xlsx) files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "python-calamine>=0.3.1",
    "defusedxml>=0.7.1",
    "filelock>=3.15.0",
]
keywords = ["mcp", "excel", "xlsx", "spreadsheet", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Homepage = "https://github.com/ruriazz/xlsx-tools-mcp"
Repository = "https://github.com/ruriazz/xlsx-tools-mcp"
Documentation = "https://github.com/ruriazz/xlsx-tools-mcp"
Issues = "https://github.com/ruriazz/xlsx-tools-mcp/issues"

[project.scripts]
xlsx-tools-mcp = "xlsx_tools_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlsx_tools_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]