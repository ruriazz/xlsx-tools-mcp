[project]
name = "xlsx-mcp"
version = "0.1.0"
description = "MCP server for accurate, structure-preserving read/write access to Excel (.xlsx) files"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "python-calamine>=0.3.1",
    "defusedxml>=0.7.1",
    "filelock>=3.15.0",
]

[project.scripts]
xlsx-mcp = "xlsx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlsx_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
